services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alfajr-elearning
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/favicon.ico"]
      interval: 30s
      timeout: 10s
      retries: 3
