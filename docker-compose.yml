services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: internasional-komputer-elearning
    restart: always
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
